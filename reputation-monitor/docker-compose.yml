services:
  api:
    build: .
    environment:
      # Inside the container always use the persistent volume path — the
      # host-side DATABASE_URL from .env is ignored on purpose.
      DATABASE_URL: sqlite:////data/repmonitor.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-1600}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      GDELT_ENABLED: ${GDELT_ENABLED:-true}
      MAX_ARTICLES_PER_SCAN: ${MAX_ARTICLES_PER_SCAN:-25}
      GUS_BIR_API_URL: ${GUS_BIR_API_URL:-https://wyszukiwarkaregontest.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc}
      GUS_BIR_API_KEY: ${GUS_BIR_API_KEY:-}
      GUS_BIR_ENABLED: ${GUS_BIR_ENABLED:-false}
      CEIDG_API_URL: ${CEIDG_API_URL:-https://dane.biznes.gov.pl/api/ceidg/v3}
      CEIDG_API_TOKEN: ${CEIDG_API_TOKEN:-}
      CEIDG_V2_API_URL: ${CEIDG_V2_API_URL:-https://dane.biznes.gov.pl/api/ceidg/v2}
      SANCTIONS_CACHE_DIR: ${SANCTIONS_CACHE_DIR:-/data/sanctions}
    ports:
      - "8000:8000"
    volumes:
      - repmonitor_data:/data
    restart: unless-stopped

volumes:
  repmonitor_data:
